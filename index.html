<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة العمر الدقيقة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
            border: 1px solid #334155;
        }

        .developer-badge {
            text-align: center;
            font-size: 0.9rem;
            font-weight: bold;
            color: #38bdf8;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(2, 132, 199, 0.2));
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid rgba(56, 189, 248, 0.4);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.1);
            letter-spacing: 0.5px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #f8fafc;
            font-size: 1.8rem;
            direction: rtl;
        }

        .form-group {
            margin-bottom: 20px;
            direction: rtl;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8;
            font-size: 0.95rem;
            text-align: right;
        }

        input[type="date"], select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
            direction: ltr;
            text-align: left;
        }

        input[type="date"]:focus, select:focus {
            border-color: #38bdf8;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0284c7;
            color: #fff;
            transform: translateY(-2px);
        }

        .result-box {
            margin-top: 25px;
            padding: 20px;
            border-radius: 8px;
            background-color: #0f172a;
            border: 1px solid #334155;
            display: none;
            direction: rtl;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #1e293b;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-item .label {
            color: #94a3b8;
        }

        .result-item .value {
            font-weight: bold;
            color: #38bdf8;
            direction: ltr;
        }

        .single-result {
            text-align: center;
            font-size: 1.4rem;
            color: #38bdf8;
            font-weight: bold;
            direction: ltr;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- شارة المطور ملفتة للانتباه -->
        <div class="developer-badge">
            ⚡ Développé par : ISS Sidi Brahim Taleb Ahmed Lemam ⚡
        </div>

        <h1>حاسبة العمر الدقيقة</h1>
        
        <div class="form-group">
            <label for="birthdate">اختر تاريخ ميلادك:</label>
            <input type="date" id="birthdate">
        </div>

        <div class="form-group">
            <label for="unit">طريقة العرض المفضلة:</label>
            <select id="unit">
                <option value="all">عرض الكل (التفاصيل الكاملة)</option>
                <option value="years">بالسنوات فقط</option>
                <option value="months">بالأشهر فقط</option>
                <option value="weeks">بالأسابيع فقط</option>
                <option value="days">بالأيام فقط</option>
                <option value="hours">بالساعات فقط</option>
            </select>
        </div>

        <button onclick="calculateAge()">احسب العمر</button>

        <div class="result-box" id="resultBox"></div>
    </div>

    <script>
        function calculateAge() {
            const birthdateInput = document.getElementById('birthdate').value;
            const unit = document.getElementById('unit').value;
            const resultBox = document.getElementById('resultBox');

            if (!birthdateInput) {
                alert('الرجاء اختيار تاريخ الميلاد أولاً!');
                return;
            }

            const birthDate = new Date(birthdateInput);
            const now = new Date();

            if (birthDate > now) {
                alert('تاريخ الميلاد لا يمكن أن يكون في المستقبل!');
                return;
            }

            const diffInMs = now - birthDate;
            
            const hours = Math.floor(diffInMs / (1000 * 60 * 60));
            const days = Math.floor(diffInMs / (1000 * 60 * 60 * 24));
            const weeks = Math.floor(days / 7);
            const months = Math.floor(days / 30.4375);
            const years = Math.floor(days / 365.25);

            resultBox.style.display = 'block';

            // استخدام اللغة الإنجليزية/الفرنسية لتنسيق الأرقام (تظهر بالأرقام اللاتينية 123)
            const formatNum = (num) => num.toLocaleString('en-US');

            if (unit === 'all') {
                resultBox.innerHTML = `
                    <div class="result-item"><span class="label">بالسنوات:</span><span class="value">${formatNum(years)} years</span></div>
                    <div class="result-item"><span class="label">بالأشهر:</span><span class="value">${formatNum(months)} months</span></div>
                    <div class="result-item"><span class="label">بالأسابيع:</span><span class="value">${formatNum(weeks)} weeks</span></div>
                    <div class="result-item"><span class="label">بالأيام:</span><span class="value">${formatNum(days)} days</span></div>
                    <div class="result-item"><span class="label">بالساعات:</span><span class="value">${formatNum(hours)} hours</span></div>
                `;
            } else {
                let text = '';
                switch (unit) {
                    case 'years':
                        text = `${formatNum(years)} years`;
                        break;
                    case 'months':
                        text = `${formatNum(months)} months`;
                        break;
                    case 'weeks':
                        text = `${formatNum(weeks)} weeks`;
                        break;
                    case 'days':
                        text = `${formatNum(days)} days`;
                        break;
                    case 'hours':
                        text = `${formatNum(hours)} hours`;
                        break;
                }
                resultBox.innerHTML = `<div class="single-result">${text}</div>`;
            }
        }
    </script>
</body>
</html>
